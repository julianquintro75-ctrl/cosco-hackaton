[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 140
target-version = "py310"
extend-exclude = ["data", "reportes", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E701", "E702", "E741"]   # el código usa «a; b» y nombres cortos de forma deliberada
